<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bainzuretta V70</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fb8c00">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bainzuretta">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/AlleRock/bainzuretta/main/icona.png">
    
    <style>
        :root { --primary: #fb8c00; --bg: #f0f2f5; --card: #ffffff; --text: #111111; --border: #888888; }
        @media (prefers-color-scheme: dark) { :root { --bg: #000000; --card: #1c1c1e; --text: #ffffff; --border: #444444; } }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Outfit', sans-serif; font-size: 17px; background: var(--bg); color: var(--text); padding-bottom: 90px; }
        header { background: var(--primary); color: white; padding: 6px 15px; text-align: center; font-weight: 900; font-family: 'Lobster', cursive; font-size: 2.6em; letter-spacing: 1px; line-height: 1.15; }
        .page { display: none; padding: 12px; width: 100%; max-width: 500px; margin: 0 auto; }
        .page.active { display: block; }
        .card { background: var(--card); padding: 15px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 15px; }
        .target-box { background: linear-gradient(135deg, #fb8c00, #f57c00); color: white; text-align: center; cursor: pointer; }
        input, select { width: 100%; height: 45px; padding: 0 10px; border: 2px solid var(--border); border-radius: 12px; background: var(--card); color: var(--text); font-size: 16px; -webkit-appearance: none; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 900; width: 100%; cursor: pointer; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: rgba(251, 140, 0, 0.1); padding: 12px; border-radius: 12px; text-align: center; border: 1px solid var(--primary); }
        .stat-box b { font-size: 1.1em; color: var(--primary); }
        .rank-item { padding: 10px; background: var(--card); border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border); }
        .rank-info { display: flex; justify-content: space-between; font-weight: 800; font-size: 0.82em; align-items: center; gap: 2px; }
        .progress-bg { background: #e0e0e0; height: 8px; border-radius: 4px; margin-top: 6px; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; transition: width 0.5s; }
        nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: var(--card); display: flex; border-top: 1px solid var(--border); z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        nav div { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 900; color: #888; font-size: 9px; flex-direction: column; }
        nav div.active { color: var(--primary); border-top: 4px solid var(--primary); }
        .btn-del { background: #ff3b30; color: white; border: none; padding: 5px 7px; border-radius: 6px; font-size: 10px; cursor: pointer; }
        .btn-edit { background: #007aff; color: white; border: none; padding: 5px 7px; border-radius: 6px; font-size: 10px; cursor: pointer; }
        .archive-recap { background: var(--primary); color: white; padding: 12px; border-radius: 15px; margin-bottom: 15px; font-size: 0.9em; text-align: center; line-height: 1.5; }
        #home.active, #diario.active, #archivio.active, #sfida.active, #ranking.active, #records.active { display: grid; grid-template-rows: auto 1fr; height: calc(100vh - 115px); overflow: hidden; padding: 0; }
        .page-fixed-top { padding: 12px 12px 0 12px; }
        .page-scroll-list { overflow-y: auto; padding: 0 12px 12px 12px; -webkit-overflow-scrolling: touch; }
        .btn-strava { background: #FC4C02; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 900; width: 100%; cursor: pointer; font-size: 13px; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-sync { background: #FC4C02; color: white; border: none; padding: 10px; border-radius: 10px; width: 100%; font-weight: bold; font-size: 11px; margin-bottom: 5px; cursor: pointer; }
        .btn-sync:disabled { background: #aaa; cursor: not-allowed; }
        .strava-status { font-size: 11px; text-align: center; padding: 5px; border-radius: 8px; margin-bottom: 5px; }
        .strava-status.ok { background: rgba(252,76,2,0.1); color: #FC4C02; }
        .strava-status.ko { background: rgba(255,59,48,0.1); color: #ff3b30; }
        #toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: bold; z-index: 9999; display: none; max-width: 90%; text-align: center; }
        #gruppo-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 2000; align-items: flex-end; justify-content: center; }
        #gruppo-modal-overlay.active { display: flex; }
        #gruppo-modal { background: var(--bg); width: 100%; max-width: 520px; max-height: 78vh; border-radius: 20px 20px 0 0; padding: 15px 12px calc(15px + env(safe-area-inset-bottom)) 12px; overflow-y: auto; border: 1px solid var(--border); -webkit-overflow-scrolling: touch; }
        #gruppo-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
        #gruppo-modal-header h3 { margin: 0; font-size: 1.05em; color: var(--primary); }
        #gruppo-modal-close { background: none; border: none; font-size: 1.6em; line-height: 1; color: var(--text); cursor: pointer; padding: 0 4px; }
        .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .strava-badge { background: #FC4C02; color: white; font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: bold; }
        .btn-strava-mini { background: #FC4C02; color: white; border: none; padding: 6px 9px; border-radius: 8px; font-size: 10px; font-weight: 900; cursor: pointer; white-space: nowrap; }
        .record-section-title { color: var(--primary); font-size: 0.8em; font-weight: 900; margin-bottom: 10px; }
        .target-box-gold {
            background: linear-gradient(135deg, #f7971e, #ffd200, #f7971e) !important;
            background-size: 200% 200% !important;
            animation: shimmerGold 2s ease-in-out infinite, pulseGold 2s ease-in-out infinite !important;
            color: #5a3a00 !important;
        }
        .target-box-gold small, .target-box-gold b, .target-box-gold #km-mancanti { color: #5a3a00 !important; }
        @keyframes shimmerGold {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 210, 0, 0.5); }
            50% { box-shadow: 0 0 20px 8px rgba(255, 210, 0, 0.4); }
        }
        @keyframes shimmer {
            0%   { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0px rgba(255,210,0,0); }
            50%       { transform: scale(1.02); box-shadow: 0 0 20px rgba(255,210,0,0.6); }
        }
        .target-box-gold {
            background: linear-gradient(110deg, #f7971e, #ffd200, #fff5a0, #ffd200, #f7971e) !important;
            background-size: 300% 100% !important;
            animation: shimmer 2.5s linear infinite, pulse-gold 2s ease-in-out infinite !important;
            color: #5a3a00 !important;
        }
        .target-box-gold small, .target-box-gold b { color: #5a3a00 !important; }
        .target-box-gold * { color: #5a3a00 !important; }
        .target-box-gold .btn-info-obiettivo { background: rgba(90,58,0,0.2) !important; color: #5a3a00 !important; }
        /* -- NUOVO: stili vista raggruppata -- */
        .vista-select-wrap { margin-top: 10px; }
        .gruppo-item { padding: 10px 12px; background: var(--card); border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border); position: relative; }
        .gruppo-header { display: flex; justify-content: space-between; align-items: center; font-weight: 900; font-size: 0.85em; color: var(--primary); margin-bottom: 4px; }
        .gruppo-sub { font-size: 0.78em; color: var(--text); opacity: 0.75; display: flex; gap: 10px; flex-wrap: wrap; }
        .gruppo-item.g-oro { border: 1px solid #d4af37; background: linear-gradient(135deg, rgba(255,215,0,0.16), var(--card) 60%); }
        .gruppo-item.g-argento { border: 1px solid #a8a9ad; background: linear-gradient(135deg, rgba(192,192,192,0.18), var(--card) 60%); }
        .gruppo-item.g-bronzo { border: 1px solid #b08d57; background: linear-gradient(135deg, rgba(205,127,50,0.16), var(--card) 60%); }
        .gruppo-medaglia { position: absolute; top: -8px; right: -6px; font-size: 1.3em; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35)); }
        /* -- LA SFIDA -- */
        .sfida-row { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--card); border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border); font-size: 0.82em; }
        .sfida-week-num { font-weight: 900; color: var(--primary); min-width: 28px; font-size: 1em; }
        .sfida-dates { flex: 1; color: var(--text); opacity: 0.7; font-size: 0.9em; }
        .sfida-quota { min-width: 52px; text-align: right; color: var(--text); opacity: 0.6; font-weight: 900; font-size: 1em; }
        .sfida-km { min-width: 52px; text-align: right; font-weight: 900; font-size: 1em; }
        .sfida-km.verde { color: #2e7d32; }
        .sfida-km.rosso { color: #c62828; }
        .sfida-km.grigio { color: #888; }
        .sfida-header-row { display: flex; gap: 8px; padding: 4px 12px 8px; font-size: 0.72em; color: #888; font-weight: 700; text-transform: uppercase; }
        .sfida-header-row .sfida-week-num { color: #888; }
    </style>
</head>
<body>

<div id="toast"></div>
<div id="gruppo-modal-overlay" onclick="if(event.target===this) chiudiGruppoModal()">
    <div id="gruppo-modal">
        <div id="gruppo-modal-header"><h3 id="gruppo-modal-title"></h3><button id="gruppo-modal-close" onclick="chiudiGruppoModal()">&times;</button></div>
        <div id="gruppo-modal-list"></div>
    </div>
</div>
<header id="main-header">Bainzuretta</header>

<div id="home" class="page active">
    <div class="page-fixed-top">
        <div class="card target-box" onclick="cambiaObiettivo()" id="target-box">
            <div style="position:relative;">
                <button onclick="event.stopPropagation(); mostraInfoObiettivo()" style="position:absolute; top:-5px; right:-5px; background:rgba(255,255,255,0.3); border:none; color:white; border-radius:50%; width:22px; height:22px; font-size:12px; font-weight:900; cursor:pointer; line-height:22px; text-align:center; padding:0;">i</button>
            </div>
            <small>&#128640; OBIETTIVO <span class="year-label"></span> &#128640;</small><br>
            <b id="km-mancanti" style="font-size: 2em;">0</b> <small>KM AL TRAGUARDO</small>
            <div style="margin-top:8px; border-top:1px solid rgba(255,255,255,0.3); padding-top:8px; font-size:0.75em;">
                Target: <b id="val-target-tot">5000</b> | Proiezione: <b id="val-proiezione">0</b> | <b id="val-week">0</b> KM/SETT
            </div>
            <div id="pace-bar" style="margin-top:8px; border-top:1px solid rgba(255,255,255,0.3); padding-top:8px; font-size:0.75em; display:none;">
                <div id="pace-label"></div>
                <div id="arrival-label" style="margin-top:3px;"></div>
            </div>
        </div>
        <div class="card">
            <div class="stats-grid">
                <div class="stat-box" style="grid-column: span 2;"><small>TOTALE KM STORICI</small><br><b id="st-km">0</b></div>
                <div class="stat-box"><small>GIRI DEL MONDO</small><br><b id="st-world">0.00</b></div>
                <div class="stat-box"><small>TOP MEDIA ANNO</small><br><b id="st-speed">0.00</b></div>
            </div>
        </div>
    </div>
    <div class="page-scroll-list">
        <div class="card">
            <h3 id="form-title" style="color:var(--primary); font-size: 0.8em; margin-bottom: 10px;">+ AGGIUNGI ATTIVITA' MANUALE</h3>
            <input type="date" id="in-date" style="margin-bottom:10px;">
            <input type="number" step="0.01" id="in-dist" placeholder="KM" style="margin-bottom:10px;">
            <input type="text" id="in-time" placeholder="HH:MM:SS" style="margin-bottom:15px;">
            <button class="btn-add" id="btn-save" onclick="salvaManuale()">SALVA</button>
        </div>
        <div class="card" style="text-align:center;">
            <div id="strava-section"></div>
            <button onclick="esportaJSON()" style="background:#444; color:white; border:none; padding:10px; border-radius:10px; width:100%; font-weight:bold; font-size: 11px; margin-bottom: 5px;">BACKUP JSON</button>
            <input type="file" id="json-input" accept=".json" style="display:none;">
            <button onclick="document.getElementById('json-input').click()" style="background:#888; color:white; border:none; padding:10px; border-radius:10px; width:100%; font-weight:bold; font-size: 11px; margin-bottom: 5px;">IMPORTA JSON</button>
            <button onclick="esportaPDF()" style="background:#1a1a2e; color:white; border:none; padding:10px; border-radius:10px; width:100%; font-weight:bold; font-size: 11px; margin-bottom: 5px;">&#128196; PDF RIEPILOGO ANNO</button>
            <button onclick="pulisciTutto()" style="background:#ff3b30; color:white; border:none; padding:10px; border-radius:10px; width:100%; font-weight:bold; font-size: 11px;">RESET DATI</button>
        </div>
    </div>
</div>

<div id="diario" class="page">
    <div class="page-fixed-top">
        <div class="card" style="text-align:center;">
            <h3 style="margin:0; font-size: 1em;">DIARIO <span class="year-label"></span></h3>
            <div class="vista-select-wrap">
                <select id="vista-diario" onchange="disegnaDiario()">
                    <option value="attivita">Attività</option>
                    <option value="mese">Mese</option>
                    <option value="settimana">Settimana</option>
                </select>
            </div>
        </div>
        <div id="recap-diario"></div>
    </div>
    <div class="page-scroll-list"><div id="lista-diario"></div></div>
</div>

<div id="archivio" class="page">
    <div class="page-fixed-top">
        <div class="card" style="text-align:center;">
            <h3 style="margin:0; font-size: 1em; margin-bottom:10px;">ARCHIVIO STORICO YTD</h3>
            <select id="sel-anno-archivio" onchange="disegnaArchivio()"></select>
            <div class="vista-select-wrap">
                <select id="vista-archivio" onchange="disegnaArchivio()">
                    <option value="attivita">Attività</option>
                    <option value="mese">Mese</option>
                    <option value="settimana">Settimana</option>
                </select>
            </div>
        </div>
        <div id="recap-archivio"></div>
    </div>
    <div class="page-scroll-list"><div id="lista-archivio"></div></div>
</div>

<div id="sfida" class="page">
    <div class="page-fixed-top">
        <div class="card" style="text-align:center;">
            <h3 style="margin:0; font-size: 1em;">&#127937; LA SFIDA <span class="year-label"></span></h3>
            <div id="sfida-recap" style="margin-top:8px; font-size:0.78em; color:#888;"></div>
        </div>
    </div>
    <div class="page-scroll-list"><div id="lista-sfida"></div></div>
</div>

<div id="ranking" class="page">
    <div class="page-fixed-top">
        <div class="card" style="text-align:center;">
            <h3 style="margin:0; font-size: 1em;">&#127942; RANKING YTD</h3>
            <select id="metrica" onchange="disegnaClassifica()" style="margin-top:10px;">
                <option value="distanza">Distanza Totale (KM)</option>
                <option value="ponderata">Media Ponderata (KM Tot / Ore Tot)</option>
                <option value="media">Media Semplice (KM/H)</option>
                <option value="dislivello">Dislivello Totale (m) — dal 2019</option>
            </select>
        </div>
    </div>
    <div class="page-scroll-list"><div id="lista-ranking"></div></div>
</div>

<div id="records" class="page">
    <div class="page-fixed-top">
        <div class="card" style="text-align:center;">
            <h3 style="margin:0; font-size: 1em;">&#128081; RECORD STORICI</h3>
            <select id="sel-record-cat" onchange="cambiaCategoriaRecord()" style="margin-top:10px;">
                <option value="dist">DISTANZA</option>
                <option value="vel">VELOCITÀ</option>
                <option value="tempo">TEMPO</option>
                <option value="disliv">DISLIVELLO</option>
                <option value="cad">CADENZA</option>
                <option value="cost">COSTANZA</option>
                <option value="cur">CURIOSITÀ</option>
            </select>
        </div>
    </div>
    <div class="page-scroll-list"><div id="lista-records"></div></div>
</div>

<nav>
    <div id="nav-home" class="active" onclick="vaiA('home')">&#127968;<span>HOME</span></div>
    <div id="nav-diario" onclick="vaiA('diario')">&#128214;<span>DIARIO</span></div>
    <div id="nav-sfida" onclick="vaiA('sfida')">&#127937;<span>SFIDA</span></div>
    <div id="nav-archivio" onclick="vaiA('archivio')">&#128194;<span>ARCHIVIO</span></div>
    <div id="nav-ranking" onclick="vaiA('ranking')">&#127942;<span>RANK</span></div>
    <div id="nav-records" onclick="vaiA('records')">&#128081;<span>RECORD</span></div>
</nav>

<script>
    const STRAVA_CLIENT_ID = '210700';
    const STRAVA_REDIRECT_URI = 'https://allerock.github.io/bainzuretta/';
    const STRAVA_SCOPE = 'activity:read_all';

    let rawData = [];
    const oggi = new Date();
    const currY = oggi.getFullYear();
    let myTarget = parseInt(localStorage.getItem('bainzuretta_target_' + currY)) || 5000;
    let stravaToken = null;

    const getDOY = (date) => {
        const start = new Date(date.getFullYear(), 0, 0);
        const diff = (date - start) + ((start.getTimezoneOffset() - date.getTimezoneOffset()) * 60 * 1000);
        return Math.floor(diff / (1000 * 60 * 60 * 24));
    };
    const doyOggi = getDOY(oggi);

    function showToast(msg, duration = 3000) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => t.style.display = 'none', duration);
    }

    function loadStravaToken() {
        try { const raw = localStorage.getItem('bainzuretta_strava'); return raw ? JSON.parse(raw) : null; } catch { return null; }
    }
    function saveStravaToken(t) { localStorage.setItem('bainzuretta_strava', JSON.stringify(t)); }
    function clearStravaToken() { localStorage.removeItem('bainzuretta_strava'); stravaToken = null; }

    function stravaLogin() {
        localStorage.setItem('bainzuretta_strava_pending', '1');
        const url = `https://www.strava.com/oauth/authorize?client_id=${STRAVA_CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(STRAVA_REDIRECT_URI)}&approval_prompt=auto&scope=${STRAVA_SCOPE}`;
        window.location.href = url;
    }

    async function stravaExchangeCode(code) {
        try {
            const secret = window._stravaSecret || localStorage.getItem('bainzuretta_strava_secret') || '';
            const resp = await fetch('https://www.strava.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ client_id: STRAVA_CLIENT_ID, client_secret: secret, grant_type: 'authorization_code', code })
            });
            if (!resp.ok) return null;
            return await resp.json();
        } catch { return null; }
    }

    function showStravaSecretPrompt(code) {
        const secret = prompt('Bainzuretta e\' un\'app personale.\n\nPer completare la connessione Strava inserisci il tuo Client Secret\n(lo trovi su strava.com/settings/api).\n\nViene salvato solo sul tuo dispositivo, mai inviato a terzi.');
        if (!secret) { showToast('Connessione annullata'); return; }
        window._stravaSecret = secret;
        localStorage.setItem('bainzuretta_strava_secret', secret);
        stravaExchangeCode(code).then(tokenData => {
            if (tokenData && tokenData.access_token) {
                saveStravaToken(tokenData); stravaToken = tokenData;
                aggiornaStravaSection(); sincronizzaStrava(true);
                showToast('Connesso a Strava!');
            } else { showToast('Errore - controlla il Client Secret'); }
        });
    }

    async function handleStravaCallback() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');
        window.history.replaceState({}, '', window.location.pathname);
        if (error || !code) return;
        localStorage.removeItem('bainzuretta_strava_pending');
        showToast('Connessione a Strava in corso...');
        const tokenData = await stravaExchangeCode(code);
        if (tokenData && tokenData.access_token) {
            saveStravaToken(tokenData); stravaToken = tokenData;
            aggiornaStravaSection(); await sincronizzaStrava(true);
            showToast('Connesso a Strava!');
        } else {
            showStravaSecretPrompt(code);
        }
    }

    async function refreshStravaToken() {
        const secret = window._stravaSecret || localStorage.getItem('bainzuretta_strava_secret') || '';
        try {
            const resp = await fetch('https://www.strava.com/oauth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ client_id: STRAVA_CLIENT_ID, client_secret: secret, grant_type: 'refresh_token', refresh_token: stravaToken.refresh_token })
            });
            if (!resp.ok) return false;
            const data = await resp.json();
            stravaToken = { ...stravaToken, access_token: data.access_token, refresh_token: data.refresh_token, expires_at: data.expires_at };
            saveStravaToken(stravaToken);
            return true;
        } catch { return false; }
    }

    async function getValidToken() {
        if (!stravaToken) return null;
        if (stravaToken.expires_at && Date.now() / 1000 > stravaToken.expires_at - 300) {
            const ok = await refreshStravaToken();
            if (!ok) { clearStravaToken(); aggiornaStravaSection(); return null; }
        }
        return stravaToken.access_token;
    }

    async function sincronizzaStrava(mostraFeedback = true) {
        const btn = document.getElementById('btn-sync-strava');
        if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> SINCRONIZZAZIONE...'; }
        const token = await getValidToken();
        if (!token) {
            if (mostraFeedback) showToast('Riconnetti Strava');
            if (btn) { btn.disabled = false; btn.innerHTML = 'SINCRONIZZA STRAVA'; }
            return;
        }
        try {
            const existingStravaIds = new Set(rawData.filter(a => a.strava_id).map(a => String(a.strava_id)));
            let afterTimestamp = 0;
            const stravaActs = rawData.filter(a => a.strava_id).sort((a, b) => new Date(b.data) - new Date(a.data));
            if (stravaActs.length > 0) afterTimestamp = Math.floor(new Date(stravaActs[0].data).getTime() / 1000);
            let nuove = [];
            let page = 1;
            while (true) {
                let apiUrl = `https://www.strava.com/api/v3/athlete/activities?per_page=100&page=${page}`;
                if (afterTimestamp > 0) apiUrl += `&after=${afterTimestamp}`;
                const res = await fetch(apiUrl, { headers: { 'Authorization': `Bearer ${token}` } });
                if (!res.ok) break;
                const activities = await res.json();
                if (!activities.length) break;
                for (const act of activities) {
                    if (!['Ride', 'VirtualRide', 'EBikeRide', 'MountainBikeRide'].includes(act.type)) continue;
                    if (existingStravaIds.has(String(act.id))) continue;
                    const distKm = act.distance / 1000;
                    const oreDec = act.moving_time / 3600;
                    const media = oreDec > 0 ? distKm / oreDec : 0;
                    nuove.push({
                        id: act.id, strava_id: act.id, data: act.start_date_local,
                        distanza: parseFloat(distKm.toFixed(2)),
                        tempo: parseFloat(oreDec.toFixed(4)),
                        media: parseFloat(media.toFixed(2)),
                        nome: act.name || '',
                        dislivello: act.total_elevation_gain || 0,
                        cadenza: act.average_cadence || 0
                    });
                }
                if (activities.length < 100) break;
                page++;
            }
            rawData = [...rawData, ...nuove].sort((a, b) => new Date(b.data) - new Date(a.data));
            localStorage.setItem('bainzuretta_raw', JSON.stringify(rawData));
            aggiornaStats(); popolaAnniArchivio();
            if (mostraFeedback) showToast(nuove.length > 0 ? `${nuove.length} nuove attivita' importate!` : 'Gia\' aggiornato!', 4000);
        } catch(e) {
            if (mostraFeedback) showToast('Errore sincronizzazione');
        } finally {
            if (btn) { btn.disabled = false; btn.innerHTML = 'SINCRONIZZA STRAVA'; }
        }
    }

                <button class="btn-sync" id="btn-sync-strava" onclick="sincronizzaStrava(true)">SINCRONIZZA STRAVA</button>

                    <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7 13.828h4.169"/></svg>

    window.onload = async () => {
        document.getElementById('main-header').innerText = 'Bainzuretta';

    function formattaTempo(oreDec) {
        let totalSec = Math.round(oreDec * 3600);
        let h = Math.floor(totalSec / 3600);
        let m = Math.floor((totalSec % 3600) / 60);
        let s = totalSec % 60;
        return `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    function aggiornaStats() {
        let totK = 0, kY = 0, pAnni = {};
        rawData.forEach(a => {
            let dist = parseFloat(a.distanza) || 0, med = parseFloat(a.media) || 0;
            let y = new Date(a.data).getFullYear();
            totK += dist; if(y === currY) kY += dist;
            if(!pAnni[y]) pAnni[y] = { mSum: 0, count: 0 };
            if(med > 0) { pAnni[y].mSum += med; pAnni[y].count++; }
        });
        document.getElementById('st-km').innerText = totK.toLocaleString('it-IT', {minimumFractionDigits:2}) + ' KM';
        document.getElementById('st-world').innerText = (totK / 40075).toFixed(2);
        let maxAvg = 0, bestY = '-';
        Object.keys(pAnni).forEach(y => { if(pAnni[y].count > 0) { let avg = pAnni[y].mSum / pAnni[y].count; if(avg > maxAvg) { maxAvg = avg; bestY = y; } } });
        document.getElementById('st-speed').innerHTML = maxAvg.toFixed(2) + ` <small>km/h (${bestY})</small>`;
        const mancanti = Math.max(0, myTarget - kY);
        document.getElementById('km-mancanti').innerText = mancanti.toLocaleString('it-IT');
        const giorniAnno = (currY % 4 === 0 && (currY % 100 !== 0 || currY % 400 === 0)) ? 366 : 365;
        document.getElementById('val-proiezione').innerText = Math.round((kY / Math.max(1, doyOggi)) * giorniAnno).toLocaleString('it-IT');
        const giorniRimanenti = Math.max(1, giorniAnno - doyOggi);
        document.getElementById('val-week').innerText = Math.ceil(mancanti / (giorniRimanenti / 7));

        const paceBar = document.getElementById('pace-bar');
        const paceLabel = document.getElementById('pace-label');
        const arrivalLabel = document.getElementById('arrival-label');
        const targetBox = document.getElementById('target-box');

        if (kY > 0 && myTarget > 0) {
            if (mancanti <= 0) {
                targetBox.className = 'card target-box target-box-gold';
                targetBox.style.background = '';
                paceBar.style.display = 'block';
                document.getElementById('km-mancanti').innerHTML = '&#127942;';
                document.querySelector('#target-box small').innerHTML = '&#11088; OBIETTIVO ' + currY + ' &#11088;';
                paceLabel.innerHTML = '<b style="font-size:1.6em; display:block; margin:6px 0; color:#5a3a00;">&#127942; OBIETTIVO RAGGIUNTO! &#127942;</b><span style="font-size:1.8em; letter-spacing:4px;">⭐⭐⭐</span>';
                arrivalLabel.innerHTML = `<span style="color:#5a3a00; font-size:0.9em;">&#127881; <b>${Math.round(kY)} km</b> fatti su ${myTarget.toLocaleString('it-IT')} — superato di <b>${Math.round(kY - myTarget)} km</b>!</span>`;
                document.getElementById('val-proiezione').innerText = Math.round((kY / Math.max(1, doyOggi)) * giorniAnno).toLocaleString('it-IT');
                document.getElementById('val-week').innerText = '0';
            } else {
                targetBox.className = 'card target-box';
                const kmAttesi = (myTarget / giorniAnno) * doyOggi;
                const diff = kY - kmAttesi;
                const percDiff = diff / kmAttesi;

                let paceEmoji, paceMsg, boxColor;
                if (percDiff >= 0) {
                    paceEmoji = '&#9989;';
                    paceMsg = `In anticipo di ${Math.abs(diff).toFixed(0)} km`;
                    boxColor = 'linear-gradient(135deg, #2e7d32, #388e3c)';
                } else if (percDiff >= -0.1) {
                    paceEmoji = '&#9888;&#65039;';
                    paceMsg = `In ritardo di ${Math.abs(diff).toFixed(0)} km`;
                    boxColor = 'linear-gradient(135deg, #f57f17, #f9a825)';
                } else {
                    paceEmoji = '&#128308;';
                    paceMsg = `In ritardo di ${Math.abs(diff).toFixed(0)} km`;
                    boxColor = 'linear-gradient(135deg, #c62828, #d32f2f)';
                }

                const kmSettimana = kY / (doyOggi / 7);
                let arrivoStr = '';
                if (kmSettimana > 0) {
                    const settimaneMancanti = mancanti / kmSettimana;
                    const dataArrivo = new Date(oggi.getTime() + settimaneMancanti * 7 * 24 * 60 * 60 * 1000);
                    arrivoStr = `&#127937; Arrivo previsto: ${dataArrivo.toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric'})}`;
                }

                targetBox.style.background = boxColor;
                paceBar.style.display = 'block';
                paceLabel.innerHTML = `${paceEmoji} ${paceMsg}`;
                arrivalLabel.innerHTML = arrivoStr;
            }
        } else {
            targetBox.className = 'card target-box';
            targetBox.style.background = 'linear-gradient(135deg, #fb8c00, #f57c00)';
            paceBar.style.display = 'none';
        }
    }

    function popolaAnniArchivio() {
        const sel = document.getElementById('sel-anno-archivio');
        const anni = [...new Set(rawData.map(a => new Date(a.data).getFullYear()))].filter(y => y !== currY).sort((a,b) => b-a);
        if(anni.length > 0) { sel.innerHTML = anni.map(y => `<option value="${y}">${y}</option>`).join(''); disegnaArchivio(); }
        else { sel.innerHTML = '<option>Nessun dato</option>'; }

    // ---- HELPER RAGGRUPPAMENTO (NUOVO) ----

    const mesiNomiBreve = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];

    function gruppaMesi(lista) {
        const gruppi = {};
        lista.forEach(a => {
            const d = new Date(a.data);
            const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
            if (!gruppi[k]) gruppi[k] = { km: 0, ore: 0, count: 0, dislivello: 0, items: [] };
            gruppi[k].km += parseFloat(a.distanza) || 0;
            const med = parseFloat(a.media) || 0;
            gruppi[k].ore += med > 0 ? (parseFloat(a.distanza) / med) : 0;
            gruppi[k].count++;
            gruppi[k].dislivello += a.dislivello || 0;
            gruppi[k].items.push(a);
        });
        return Object.keys(gruppi).sort((a,b) => b.localeCompare(a)).map(k => ({ key: k, ...gruppi[k] }));
    }

    function gruppaSett(lista) {
        const gruppi = {};
        lista.forEach(a => {
            const d = new Date(a.data);
            const day = d.getDay() === 0 ? 6 : d.getDay() - 1;
            const lun = new Date(d); lun.setDate(d.getDate() - day); lun.setHours(0,0,0,0);
            const k = lun.toISOString().slice(0,10);
            if (!gruppi[k]) gruppi[k] = { km: 0, ore: 0, count: 0, dislivello: 0, items: [] };
            gruppi[k].km += parseFloat(a.distanza) || 0;
            const med = parseFloat(a.media) || 0;
            gruppi[k].ore += med > 0 ? (parseFloat(a.distanza) / med) : 0;
            gruppi[k].count++;
            gruppi[k].dislivello += a.dislivello || 0;
            gruppi[k].items.push(a);
        });
        return Object.keys(gruppi).sort((a,b) => b.localeCompare(a)).map(k => ({ key: k, ...gruppi[k] }));
    }

    let gruppiAttivitaMap = {};

    function renderGruppoItem(label, g, rank) {
        gruppiAttivitaMap[g.key] = { items: g.items, label };
        const medPond = g.ore > 0 ? (g.km / g.ore).toFixed(1) : '—';
        const disStr = g.dislivello > 0 ? `<span>&#9650; ${Math.round(g.dislivello).toLocaleString('it-IT')} m</span>` : '';
        const medaglie = { 1: ['g-oro', '&#129351;'], 2: ['g-argento', '&#129352;'], 3: ['g-bronzo', '&#129353;'] };
        const [rankClass, rankIcon] = medaglie[rank] || ['', ''];
        const medagliaHtml = rankIcon ? `<span class="gruppo-medaglia">${rankIcon}</span>` : '';
        return `<div class="gruppo-item ${rankClass}" style="cursor:pointer;" onclick="mostraGruppoAttivita('${g.key}')">
            ${medagliaHtml}
            <div class="gruppo-header"><span>${label}</span><span>${g.km.toFixed(1)} km</span></div>
            <div class="gruppo-sub">
                <span>&#128336; ${g.count} uscite</span>
                <span>&#128205; ${medPond} km/h</span>
                ${disStr}
            </div>
        </div>`;
    }

    function mostraGruppoAttivita(key) {
        const dati = gruppiAttivitaMap[key];
        if (!dati) return;
        const lista = [...dati.items].sort((a,b) => new Date(b.data) - new Date(a.data));
        document.getElementById('gruppo-modal-title').textContent = dati.label;
        const cont = document.getElementById('gruppo-modal-list');
        cont.innerHTML = lista.map(a => {
            let badge = a.strava_id ? '<span class="strava-badge">STRAVA</span> ' : '';
            let rigaDati = `<b>${parseFloat(a.distanza).toFixed(1)}</b>km | <b>${formattaTempo(a.tempo)}</b> | <b>${parseFloat(a.media).toFixed(1)}</b>km/h`;
            return `<div class="rank-item" style="cursor:pointer;" onclick="apriAttivita(${a.id})"><div class="rank-info"><span>${new Date(a.data).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'})}</span><span style="color:var(--primary);">${badge}${rigaDati} <small style="color:#bbb;">&#9432;</small></span></div></div>`;
        }).join('');
        document.getElementById('gruppo-modal-overlay').classList.add('active');
    }

    function chiudiGruppoModal() {
        document.getElementById('gruppo-modal-overlay').classList.remove('active');
    }

    function calcolaTopGruppi(gruppi) {
        const top = [...gruppi].sort((a, b) => b.km - a.km).slice(0, 3);
        const mappa = {};
        top.forEach((g, i) => { mappa[g.key] = i + 1; });
        return mappa;
    }

        document.getElementById('recap-diario').innerHTML = `<div class="archive-recap">Nel <b>${currY}</b> (al giorno ${doyOggi}):<br><b>${tKmD.toFixed(1)} KM</b> in <b>${lista.length} attivita'</b><br>Media Ponderata: <b>${medPondD} km/h</b>${disStrD}</div>`;

        if (vista === 'attivita') {

                let rigaDati = `<b>${parseFloat(a.distanza).toFixed(1)}</b>km | <b>${formattaTempo(a.tempo)}</b> | <b>${parseFloat(a.media).toFixed(1)}</b>km/h`;
                c.innerHTML += `<div class="rank-item" style="cursor:pointer;" onclick="apriAttivita(${a.id})"><div class="rank-info"><span>${new Date(a.data).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit'})}</span><span style="color:var(--primary);">${badge}${rigaDati} <small style="color:#bbb;">&#9432;</small></span><div style="display:flex; gap:2px;">${editBtn}<button class="btn-del" onclick="event.stopPropagation();eliminaAttivita(${a.id})">X</button></div></div></div>`;

            const gruppiMese = gruppaMesi(lista);
            const topMese = calcolaTopGruppi(gruppiMese);
            gruppiMese.forEach(g => {
                const [y, m] = g.key.split('-');
                c.innerHTML += renderGruppoItem(`${mesiNomiBreve[parseInt(m)-1]} ${y}`, g, topMese[g.key]);
            });
        } else if (vista === 'settimana') {
            const gruppiSett = gruppaSett(lista);
            const topSett = calcolaTopGruppi(gruppiSett);
            gruppiSett.forEach(g => {
                const lun = new Date(g.key + 'T00:00:00');
                const dom = new Date(lun); dom.setDate(lun.getDate() + 6);
                const label = `${lun.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})} – ${dom.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})}`;
                c.innerHTML += renderGruppoItem(label, g, topSett[g.key]);

        }
    }

    // ---- ARCHIVIO (MODIFICATO) ----

    function disegnaArchivio() {

        const vista = document.getElementById('vista-archivio').value;

        let tKm = 0, tOre = 0, tDis = 0, nAtt = filtrati.length;
        filtrati.forEach(a => {
            tKm += parseFloat(a.distanza); tOre += (parseFloat(a.distanza) / parseFloat(a.media));
            tDis += parseFloat(a.dislivello) || 0;
        });
        let medPond = tOre > 0 ? (tKm / tOre).toFixed(2) : '0.00';
        let disStr = tDis > 0 ? `<br>Dislivello: <b>${Math.round(tDis).toLocaleString('it-IT')} m</b>` : '';
        recapCont.innerHTML = `<div class="archive-recap">Nel <b>${annoScelto}</b> (al giorno ${doyOggi}):<br><b>${tKm.toFixed(1)} KM</b> in <b>${nAtt} attivita'</b><br>Media Ponderata: <b>${medPond} km/h</b>${disStr}</div>`;

        if (vista === 'attivita') {

                listaCont.innerHTML += renderGruppoItem(label, g, topSettArch[g.key]);

    function disegnaClassifica() {
        const m = document.getElementById('metrica').value;
        const container = document.getElementById('lista-ranking');
        container.innerHTML = '';
        let p = {};
        rawData.forEach(a => {
            let dt = new Date(a.data), y = dt.getFullYear();
            if (m === 'dislivello' && y < 2019) return;
            if(!p[y]) p[y] = { d:0, tSum:0, mSum:0, c:0, dis:0, tot:0 };
            p[y].tot += parseFloat(a.distanza) || 0;
            if(getDOY(dt) <= doyOggi) {
                let dist = parseFloat(a.distanza) || 0, med = parseFloat(a.media) || 0;
                p[y].d += dist; p[y].mSum += med; p[y].c++; p[y].tSum += (med > 0 ? dist / med : 0);
                if (y >= 2019) p[y].dis += a.dislivello || 0;
            }
        });
        let s = Object.keys(p).sort((a,b) => {
            if(m==='distanza') return p[b].d - p[a].d;
            if(m==='ponderata') return (p[b].d / (p[b].tSum || 1)) - (p[a].d / (p[a].tSum || 1));
            if(m==='dislivello') return p[b].dis - p[a].dis;
            return (p[b].mSum / (p[b].c || 1)) - (p[a].mSum / (p[a].c || 1));
        });
        let maxVal = s.length ? Math.max(...s.map(y => { if(m==='distanza') return p[y].d; if(m==='ponderata') return (p[y].d / (p[y].tSum || 1)); if(m==='dislivello') return p[y].dis; return (p[y].mSum / (p[y].c || 1)); })) : 1;
        s.forEach((y, i) => {
            let val = m==='distanza' ? p[y].d : m==='ponderata' ? (p[y].d / (p[y].tSum || 1)) : m==='dislivello' ? p[y].dis : (p[y].mSum / (p[y].c || 1));
            let unit = m==='distanza' ? ' km' : m==='dislivello' ? ' m' : ' km/h';
            let displayVal = m==='dislivello' ? Math.round(val).toLocaleString('it-IT') + unit : val.toFixed(2) + unit;
            let isCurrentYear = parseInt(y) === currY;
            let linkStyle = !isCurrentYear ? 'cursor:pointer;' : '';
            let linkHint = !isCurrentYear ? ` onclick="apriArchivioAnno(${y})" title="Apri in Archivio"` : '';
            let totAnnoHtml = (m === 'distanza' && !isCurrentYear) ? ` <span style="color:#1565c0; font-weight:600;">${Math.round(p[y].tot).toLocaleString('it-IT')} km</span>` : '';
            container.innerHTML += `<div class="rank-item" style="${linkStyle}"${linkHint}><div class="rank-info"><span>${i+1}. ${y}${!isCurrentYear ? ' <small style="color:#aaa;">&#8599;</small>' : ''}</span><span style="color:var(--primary)">${displayVal}${totAnnoHtml}</span></div><div class="progress-bg"><div class="progress-fill" style="width:${maxVal > 0 ? (val/maxVal)*100 : 0}%"></div></div></div>`;
        });
    }

    function cambiaCategoriaRecord() {
        localStorage.setItem('bainzuretta_record_cat', document.getElementById('sel-record-cat').value);
        disegnaRecords();
        document.getElementById('lista-records').parentElement.scrollTop = 0;
    }

    function disegnaRecords() {
        const c = document.getElementById('lista-records');
        const sel = document.getElementById('sel-record-cat');
        let cat = localStorage.getItem('bainzuretta_record_cat') || 'dist';
        if (![...sel.options].some(o => o.value === cat)) cat = 'dist';
        sel.value = cat;
        c.innerHTML = '';
        if (!rawData.length) { c.innerHTML = '<div class="card" style="text-align:center;">Nessun dato</div>'; return; }

        const mesiNomi = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
        const giorniNomi = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
        const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const num = (v) => parseFloat(v) || 0;
        const kmA = (a) => num(a.distanza);
        const fmtN = (n, d) => n.toLocaleString('it-IT', {minimumFractionDigits: d, maximumFractionDigits: d});
        const fmtData = (s) => { const p = s.slice(0,10).split('-'); return `${p[2]}/${p[1]}/${p[0]}`; };
        const fmtOre = (h) => { const tm = Math.round(h * 60); return `${Math.floor(tm/60)} h ${String(tm%60).padStart(2,'0')} m`; };
        const nomeMese = (k) => `${mesiNomi[parseInt(k.slice(5,7))-1]} ${k.slice(0,4)}`;

        // ---- Settimane lunedì-domenica + strisce (calcolo storico, NON modificare) ----
        const MONDAY_ANCHOR = new Date('1970-01-05T00:00:00Z').getTime();
        const getAbsWeek = (dateStr) => {
            const d = new Date(dateStr);
            const dayUTC = d.getUTCDay() === 0 ? 6 : d.getUTCDay() - 1;
            const mondayUTC = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - dayUTC);
            return Math.floor((mondayUTC - MONDAY_ANCHOR) / (7 * 24 * 60 * 60 * 1000));
        };
        const getMondayFromAbs = (absWeek) => { const d = new Date(MONDAY_ANCHOR + absWeek * 7 * 24 * 60 * 60 * 1000); return d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric', timeZone:'UTC'}); };
        const getSundayFromAbs = (absWeek) => { const d = new Date(MONDAY_ANCHOR + (absWeek * 7 + 6) * 24 * 60 * 60 * 1000); return d.toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric', timeZone:'UTC'}); };

        const settimaneAssolute = [...new Set(rawData.map(a => getAbsWeek(a.data)))].sort((a,b) => a-b);
        let maxStriscia = 1;
        let maxStart = settimaneAssolute[0], maxEnd = settimaneAssolute[0];
        let tutteStrisce = [];
        let curStart = settimaneAssolute[0], curLen = 1;
        for (let i = 1; i < settimaneAssolute.length; i++) {
            if (settimaneAssolute[i] === settimaneAssolute[i-1] + 1) {
                curLen++;
                if (curLen > maxStriscia) { maxStriscia = curLen; maxStart = curStart; maxEnd = settimaneAssolute[i]; }
            } else {
                tutteStrisce.push({ len: curLen, start: curStart, end: settimaneAssolute[i-1] });
                curLen = 1; curStart = settimaneAssolute[i];
            }
        }
        tutteStrisce.push({ len: curLen, start: curStart, end: settimaneAssolute[settimaneAssolute.length-1] });
        tutteStrisce.sort((a,b) => b.len - a.len);
        const settOggi = getAbsWeek(oggi.toISOString());
        let strisciaAttuale = 0, sw = settOggi;
        const setSet = new Set(settimaneAssolute);
        while (setSet.has(sw)) { strisciaAttuale++; sw--; }
        // ---- fine calcolo strisce ----

        const labSett = (k) => `${getMondayFromAbs(+k)} – ${getSundayFromAbs(+k)}`;
        const kSett = (a) => getAbsWeek(a.data);
        const kMese = (a) => a.data.slice(0,7);
        const kAnno = (a) => a.data.slice(0,4);
        const subNome = (a) => a.nome ? esc(a.nome) : '';
        const subNomeKm = (a) => [subNome(a), fmtN(kmA(a),1) + ' km'].filter(Boolean).join(' · ');

        // classifica di singole attività
        const perAttivita = (arr, keyFn, valFn, subFn = subNome, desc = true) =>
            [...arr].sort((a,b) => desc ? keyFn(b) - keyFn(a) : keyFn(a) - keyFn(b)).slice(0,5)
                .map(a => ({ t: fmtData(a.data), sub: subFn(a), val: valFn(a), act: a }));
        // classifica di gruppi (settimane / mesi / anni)
        const perGruppo = (arr, keyFn, valFn, labelFn, fmtVal) => {
            const m = {};
            arr.forEach(a => { const k = keyFn(a); m[k] = (m[k] || 0) + valFn(a); });
            return Object.keys(m).map(k => ({ k, v: m[k] })).sort((x,y) => y.v - x.v).slice(0,5)
                .map(o => ({ t: labelFn(o.k), val: fmtVal(o.v) }));
        };
        const elenco = (arr) => arr.map(a => ({ t: fmtData(a.data), sub: subNome(a), val: `${fmtN(kmA(a),1)} km`, act: a }));
        const fascia = (min, max, inclMax) => rawData.filter(a => kmA(a) >= min && (max === null || (inclMax ? kmA(a) <= max : kmA(a) < max)));

        // finestre mobili di N giorni (qualsiasi intervallo consecutivo, non solo settimane di calendario)
        const finestreMobili = (N) => {
            const dayKm = {};
            rawData.forEach(a => { const g = a.data.slice(0,10); dayKm[g] = (dayKm[g] || 0) + kmA(a); });
            const toNum = (g) => Math.floor(Date.UTC(+g.slice(0,4), +g.slice(5,7)-1, +g.slice(8,10)) / 86400000);
            const fmtGN = (n) => new Date(n * 86400000).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric', timeZone:'UTC'});
            const giorni = Object.keys(dayKm).map(g => ({ n: toNum(g), km: dayKm[g] })).sort((a,b) => a.n - b.n);
            const fin = [];
            for (let i = 0; i < giorni.length; i++) {
                let s = 0;
                for (let k = i; k < giorni.length && giorni[k].n < giorni[i].n + N; k++) s += giorni[k].km;
                fin.push({ from: giorni[i].n, to: giorni[i].n + N - 1, km: s });
            }
            fin.sort((a,b) => b.km - a.km);
            const top = [];
            for (const f of fin) {
                if (!top.some(t => f.from <= t.to && f.to >= t.from)) top.push(f);
                if (top.length >= 5) break;
            }
            return top.map(f => ({ t: `dal ${fmtGN(f.from)} al ${fmtGN(f.to)}`, val: `${fmtN(f.km,0)} km` }));
        };

        const R = (emoji, titolo, entries, extra) => Object.assign({ emoji, titolo, entries }, extra || {});
        const dati2019 = rawData.filter(a => parseInt(a.data.slice(0,4)) >= 2019 && a.dislivello && a.dislivello > 0);
        const conCad = rawData.filter(a => a.cadenza && a.cadenza > 0);
        const conMedia = rawData.filter(a => num(a.media) > 0);
        const velVal = (a) => `${num(a.media).toFixed(2)} km/h`;
        const cadVal = (a) => `${fmtN(a.cadenza,1)} rpm`;
        const cadKey = (a) => a.cadenza;

        const CATEGORIE = {
            dist: () => {
                const l100 = fascia(100, null).sort((a,b) => kmA(b) - kmA(a));
                const l150 = fascia(150, null).sort((a,b) => kmA(b) - kmA(a));
                return {
                    titolo: 'DISTANZA', nota: '',
                    recs: [
                        R('🏆', 'Giro più lungo', perAttivita(rawData, kmA, a => `${fmtN(kmA(a),1)} km`)),
                        R('💯', 'Uscite ≥100 km', elenco(l100), { tutte: true, val: `${l100.length} uscite` }),
                        R('🚀', 'Uscite ≥150 km', elenco(l150), { tutte: true, val: `${l150.length} uscite` }),
                        R('📅', 'Settimana con più km', perGruppo(rawData, kSett, kmA, labSett, v => `${fmtN(v,0)} km`)),
                        R('🗓️', 'Mese con più km', perGruppo(rawData, kMese, kmA, nomeMese, v => `${fmtN(v,0)} km`)),
                        R('🏅', 'Anno con più km', perGruppo(rawData, kAnno, kmA, k => k, v => `${fmtN(v,0)} km`)),
                        R('🔄', 'Max km in 7 giorni mobili', finestreMobili(7))
                    ]
                };
            },
            vel: () => ({
                titolo: 'VELOCITÀ', nota: '',
                recs: [
                    R('⚡', 'Media più alta in assoluto', perAttivita(conMedia, a => num(a.media), velVal, subNomeKm)),
                    R('🚴', 'Media più alta su uscite 30–49,9 km', perAttivita(fascia(30, 50).filter(a => num(a.media) > 0), a => num(a.media), velVal, subNomeKm)),
                    R('🚴', 'Media più alta su uscite 50–99,9 km', perAttivita(fascia(50, 100).filter(a => num(a.media) > 0), a => num(a.media), velVal, subNomeKm)),
                    R('🚴', 'Media più alta su uscite ≥100 km', perAttivita(fascia(100, null).filter(a => num(a.media) > 0), a => num(a.media), velVal, subNomeKm)),
                    R('🎯', 'Miglior media su uscite 50–60 km', perAttivita(fascia(50, 60, true).filter(a => num(a.media) > 0), a => num(a.media), velVal, subNomeKm)),
                    R('🎯', 'Miglior media su uscite 100–110 km', perAttivita(fascia(100, 110, true).filter(a => num(a.media) > 0), a => num(a.media), velVal, subNomeKm))
                ]
            }),
            tempo: () => ({
                titolo: 'TEMPO', nota: '',
                recs: [
                    R('⏱️', 'Uscita più lunga', perAttivita(rawData, a => num(a.tempo), a => formattaTempo(num(a.tempo)), subNomeKm)),
                    R('📅', 'Settimana con più ore in sella', perGruppo(rawData, kSett, a => num(a.tempo), labSett, fmtOre)),
                    R('🗓️', 'Mese con più ore in sella', perGruppo(rawData, kMese, a => num(a.tempo), nomeMese, fmtOre)),
                    R('🏅', 'Anno con più ore in sella', perGruppo(rawData, kAnno, a => num(a.tempo), k => k, fmtOre))
                ]
            }),
            disliv: () => ({
                titolo: 'DISLIVELLO', nota: 'Dislivello considerato dal 2019',
                recs: [
                    R('🏔️', 'Più dislivello in un’uscita', perAttivita(dati2019, a => a.dislivello, a => `${fmtN(a.dislivello,0)} m`, subNomeKm)),
                    R('📈', 'Maggior densità di salita (min 20 km)', perAttivita(dati2019.filter(a => kmA(a) >= 20), a => a.dislivello / kmA(a), a => `${fmtN(a.dislivello / kmA(a),1)} m D+/km`, a => [subNome(a), `${fmtN(kmA(a),1)} km · ${fmtN(a.dislivello,0)} m`].filter(Boolean).join(' · '))),
                    R('📅', 'Settimana con più dislivello', perGruppo(dati2019, kSett, a => a.dislivello, labSett, v => `${fmtN(v,0)} m`)),
                    R('🗓️', 'Mese con più dislivello', perGruppo(dati2019, kMese, a => a.dislivello, nomeMese, v => `${fmtN(v,0)} m`)),
                    R('🏅', 'Anno con più dislivello', perGruppo(dati2019, kAnno, a => a.dislivello, k => k, v => `${fmtN(v,0)} m`))
                ]
            }),
            cad: () => {
                const s = {}, n = {};
                conCad.forEach(a => { const y = a.data.slice(0,4); s[y] = (s[y] || 0) + a.cadenza; n[y] = (n[y] || 0) + 1; });
                const anniCad = Object.keys(s).map(y => ({ y, v: s[y] / n[y], n: n[y] })).sort((a,b) => b.v - a.v).slice(0,5)
                    .map(o => ({ t: o.y, sub: `${o.n} uscite con dato`, val: `${fmtN(o.v,1)} rpm` }));
                return {
                    titolo: 'CADENZA', nota: 'Solo attività con dato di cadenza',
                    recs: [
                        R('🦵', 'Cadenza media più alta', perAttivita(conCad, cadKey, cadVal, subNomeKm)),
                        R('🦵', 'Cadenza media più alta su uscite 30–49,9 km', perAttivita(fascia(30, 50).filter(a => a.cadenza > 0), cadKey, cadVal, subNomeKm)),
                        R('🦵', 'Cadenza media più alta su uscite 50–99,9 km', perAttivita(fascia(50, 100).filter(a => a.cadenza > 0), cadKey, cadVal, subNomeKm)),
                        R('🦵', 'Cadenza media più alta su uscite ≥100 km', perAttivita(fascia(100, null).filter(a => a.cadenza > 0), cadKey, cadVal, subNomeKm)),
                        R('🏅', 'Anno con cadenza media più alta', anniCad)
                    ]
                };
            },
            cost: () => ({
                titolo: 'COSTANZA', nota: '',
                recs: [
                    R('🔥', 'Striscia più lunga di settimane consecutive', tutteStrisce.slice(0,5).map(s => ({ t: `dal ${getMondayFromAbs(s.start)} al ${getSundayFromAbs(s.end)}`, val: `${s.len} sett.` }))),
                    R('⏳', 'Striscia attuale', [], {
                        val: strisciaAttuale > 0 ? `${strisciaAttuale} sett.` : '—',
                        sub: strisciaAttuale > 0 ? `dal ${getMondayFromAbs(settOggi - strisciaAttuale + 1)}` : ''
                    }),
                    R('📅', 'Settimana con più uscite', perGruppo(rawData, kSett, () => 1, labSett, v => `${v} uscite`)),
                    R('🗓️', 'Mese con più uscite', perGruppo(rawData, kMese, () => 1, nomeMese, v => `${v} uscite`)),
                    R('🏅', 'Anno con più uscite', perGruppo(rawData, kAnno, () => 1, k => k, v => `${v} uscite`))
                ]
            }),
            cur: () => {
                const perGiorno = {}, perMeseAnno = {};
                rawData.forEach(a => {
                    const g = new Date(a.data.slice(0,10) + 'T00:00:00Z').getUTCDay();
                    perGiorno[g] = (perGiorno[g] || 0) + 1;
                    const m = parseInt(a.data.slice(5,7)) - 1;
                    perMeseAnno[m] = (perMeseAnno[m] || 0) + 1;
                });
                const classifica = (obj, nomi) => Object.keys(obj).map(k => ({ k, v: obj[k] })).sort((a,b) => b.v - a.v).slice(0,5)
                    .map(o => ({ t: nomi[+o.k], val: `${o.v} uscite` }));
                const totKm = rawData.reduce((s,a) => s + kmA(a), 0);
                const primo = rawData.reduce((m,a) => a.data < m ? a.data : m, rawData[0].data);
                const mesiTot = (oggi.getFullYear() - parseInt(primo.slice(0,4))) * 12 + (oggi.getMonth() - (parseInt(primo.slice(5,7)) - 1)) + 1;
                const n100 = fascia(100, null).length, n150 = fascia(150, null).length;
                return {
                    titolo: 'CURIOSITÀ', nota: '',
                    recs: [
                        R('📆', 'Giorno della settimana più pedalato', classifica(perGiorno, giorniNomi)),
                        R('🌱', 'Mese dell’anno più pedalato', classifica(perMeseAnno, mesiNomi)),
                        R('🔥', 'Max km in 4 giorni', finestreMobili(4)),
                        R('📏', 'Media km per uscita', [], { val: `${fmtN(totKm / rawData.length,1)} km` }),
                        R('📊', 'Media uscite per mese', [], { val: `${fmtN(rawData.length / Math.max(1, mesiTot),1)} uscite` }),
                        R('💯', 'Numero di uscite ≥100 km', [], { val: `${n100}` }),
                        R('🚀', 'Numero di uscite ≥150 km', [], { val: `${n150}` })
                    ]
                };
            }
        };

        const def = CATEGORIE[cat]();
        window._recList = def.recs;
        let html = `<div class="card"><div class="record-section-title">${def.titolo}</div>`;
        def.recs.forEach((d, i) => {
            const best = d.entries[0];
            const val = d.val !== undefined ? d.val : (best ? best.val : '—');
            let sub = d.sub || '';
            if (d.val === undefined && best) sub = best.t + (best.sub ? ' — ' + best.sub : '');
            const click = d.entries.length > 0;
            html += `<div class="rank-item"${click ? ` data-rec="${i}" style="cursor:pointer;"` : ''}>
                <div class="rank-info">
                    <span>${d.emoji} ${d.titolo}${sub ? `<br><small style="color:#888;font-weight:400;">${sub}</small>` : ''}</span>
                    <span style="color:var(--primary); text-align:right;">${val}${click ? ' <small style="color:#bbb;">&#8250;</small>' : ''}</span>
                </div></div>`;
        });
        html += '</div>';
        if (def.nota) html += `<div style="font-size:0.7em; color:#888; text-align:center; margin-bottom:10px;">${def.nota}</div>`;
        c.innerHTML = html;
        c.onclick = (e) => {
            const r = e.target.closest('[data-rec]');
            if (r) apriTop5Record(parseInt(r.dataset.rec));
        };
    }

    function apriTop5Record(i) {
        const d = (window._recList || [])[i];
        if (!d || !d.entries.length) return;
        const lista = d.tutte ? d.entries : d.entries.slice(0,5);
        document.getElementById('gruppo-modal-title').textContent = d.tutte ? `${d.titolo} (${lista.length})` : `TOP 5 — ${d.titolo}`;
        const medaglie = ['🥇','🥈','🥉','4.','5.'];
        document.getElementById('gruppo-modal-list').innerHTML = lista.map((e, k) => {
            const pos = d.tutte ? `${k+1}.` : medaglie[k];
            const strava = (e.act && e.act.strava_id)
                ? `<button class="btn-strava-mini" onclick="apriStrava('${e.act.strava_id}')">STRAVA</button>` : '';
            return `<div class="rank-item" style="display:flex; align-items:center; gap:8px;">
                <div style="min-width:28px; font-weight:900; font-size:0.9em;">${pos}</div>
                <div style="flex:1; font-size:0.82em; font-weight:800; line-height:1.3;">${e.t}${e.sub ? `<br><small style="color:#888; font-weight:400;">${e.sub}</small>` : ''}</div>
                <div style="color:var(--primary); font-weight:800; font-size:0.85em; text-align:right;">${e.val}</div>
                ${strava}
            </div>`;
        }).join('');
        document.getElementById('gruppo-modal-overlay').classList.add('active');
    }

    function apriStrava(stravaId) {
        const webUrl = 'https://www.strava.com/activities/' + stravaId;
        const appUrl = 'strava://activities/' + stravaId;
        let tornato = false;
        document.addEventListener('visibilitychange', function onHide() {
            if (document.hidden) { tornato = true; }
            document.removeEventListener('visibilitychange', onHide);
        }, { once: true });
        window.location.href = appUrl;
        setTimeout(function () {
            if (!tornato) { window.open(webUrl, '_blank'); }
        }, 800);
    }

    async function salvaManuale() {
        const d = document.getElementById('in-date').value, k = parseFloat(document.getElementById('in-dist').value);
        if(!d || isNaN(k)) return;
        let tInput = document.getElementById('in-time').value, tDec = 0;
        if(tInput.includes(':')) { let p = tInput.split(':'); tDec = parseInt(p[0]) + (parseInt(p[1])/60) + (p[2]?parseInt(p[2])/3600:0); }
        else { tDec = parseFloat(tInput) || 0; }
        let med = tDec > 0 ? (k / tDec) : 0;
        rawData.push({ id: Date.now(), data: new Date(d).toISOString(), distanza: k, tempo: tDec, media: med });
        localStorage.setItem('bainzuretta_raw', JSON.stringify(rawData));
        showToast('Attivita\' salvata!');
        aggiornaStats(); popolaAnniArchivio();
        document.getElementById('in-dist').value = '';
        document.getElementById('in-time').value = '';
        document.getElementById('in-date').valueAsDate = oggi;
        document.getElementById('form-title').innerText = '+ AGGIUNGI ATTIVITA\' MANUALE';
        document.getElementById('btn-save').innerText = 'SALVA';
    }

    function preparaModifica(id) {
        const a = rawData.find(x => x.id === id); if(!a) return;
        vaiA('home');
        document.getElementById('form-title').innerText = 'MODIFICA ATTIVITA\'';
        document.getElementById('btn-save').innerText = 'AGGIORNA';
        document.getElementById('in-date').value = a.data.split('T')[0];
        document.getElementById('in-dist').value = a.distanza;
        document.getElementById('in-time').value = formattaTempo(a.tempo);
        rawData = rawData.filter(x => x.id !== id);
    }

    function disegnaSfida() {
        const container = document.getElementById('lista-sfida');
        const recap = document.getElementById('sfida-recap');
        container.innerHTML = '';

        const quotaSettimana = myTarget / 52;

        // Settimana corrente (numero ISO)
        function getISOWeek(d) {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const day = date.getUTCDay() || 7;
            date.setUTCDate(date.getUTCDate() + 4 - day);
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
            return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
        }

        function getLunFromWeek(year, week) {
            // Lunedì della settimana ISO
            const jan4 = new Date(year, 0, 4);
            const dayOfWeek = (jan4.getDay() + 6) % 7;
            const firstMon = new Date(jan4);
            firstMon.setDate(jan4.getDate() - dayOfWeek);
            const lun = new Date(firstMon);
            lun.setDate(firstMon.getDate() + (week - 1) * 7);
            return lun;
        }

        const settimanaCorrente = getISOWeek(oggi);

        // Mappa km per settimana ISO dell'anno corrente
        const kmPerSett = {};
        rawData.filter(a => new Date(a.data).getFullYear() === currY).forEach(a => {
            const d = new Date(a.data);
            const w = getISOWeek(d);
            if (!kmPerSett[w]) kmPerSett[w] = 0;
            kmPerSett[w] += parseFloat(a.distanza) || 0;
        });

        recap.innerHTML = `Obiettivo: <b>${myTarget.toLocaleString('it-IT')} km</b> · Quota sett.: <b>${quotaSettimana.toFixed(1)} km</b>`;

        // Header colonne
        container.innerHTML = `<div class="sfida-header-row">
            <span class="sfida-week-num">#</span>
            <span class="sfida-dates" style="flex:1;">Periodo</span>
            <span class="sfida-quota">Quota</span>
            <span class="sfida-km" style="min-width:80px; text-align:right;">Fatto</span>
        </div>`;

        for (let w = settimanaCorrente; w >= 1; w--) {
            const lun = getLunFromWeek(currY, w);
            const dom = new Date(lun); dom.setDate(lun.getDate() + 6);
            const kmFatti = kmPerSett[w] || 0;
            const isCurrent = (w === settimanaCorrente);

            let classeKm, testoKm, deltaHtml = '';
            if (isCurrent && kmFatti === 0) {
                classeKm = 'grigio';
                testoKm = '—';
            } else if (kmFatti >= quotaSettimana) {
                classeKm = 'verde';
                const delta = kmFatti - quotaSettimana;
                testoKm = kmFatti.toFixed(1) + ' km';
                deltaHtml = `<span style="font-weight:400; color:#2e7d32;"> +${delta.toFixed(1)}</span>`;
            } else {
                classeKm = 'rosso';
                const delta = kmFatti - quotaSettimana;
                testoKm = kmFatti.toFixed(1) + ' km';
                deltaHtml = `<span style="font-weight:400; color:#c62828;"> ${delta.toFixed(1)}</span>`;
            }

            const dateLabel = `${lun.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})} – ${dom.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})}`;
            const currentStyle = isCurrent ? 'border-color: var(--primary);' : '';

            container.innerHTML += `<div class="sfida-row" style="${currentStyle}">
                <span class="sfida-week-num">${w}</span>
                <span class="sfida-dates">${dateLabel}</span>
                <span class="sfida-quota">${quotaSettimana.toFixed(1)}</span>
                <span class="sfida-km ${classeKm}" style="min-width:80px;">${testoKm}${deltaHtml}</span>
            </div>`;
        }
    }

    function esportaPDF() {
        const anno = currY;
        const datiAnno = rawData.filter(a => new Date(a.data).getFullYear() === anno);
        if (!datiAnno.length) { showToast('Nessun dato per ' + anno); return; }
        const totKm = datiAnno.reduce((s,a) => s + parseFloat(a.distanza), 0);
        const totOre = datiAnno.reduce((s,a) => s + parseFloat(a.tempo), 0);
        const medPond = totOre > 0 ? (totKm / totOre) : 0;
        const nUscite = datiAnno.length;
        const mesiNomi = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
        let pMesi = {};
        datiAnno.forEach(a => { const m = new Date(a.data).getMonth(); if (!pMesi[m]) pMesi[m] = { km: 0, count: 0 }; pMesi[m].km += parseFloat(a.distanza); pMesi[m].count++; });
        const top5Dist = [...datiAnno].sort((a,b) => b.distanza - a.distanza).slice(0,5);
        const top5Media = [...datiAnno].filter(a => a.media > 0).sort((a,b) => b.media - a.media).slice(0,5);
        const datiAnnoOrd = [...datiAnno].sort((a,b) => new Date(a.data) - new Date(b.data));
        const conCadenzaAnno = datiAnno.filter(a => a.cadenza && a.cadenza > 0);
        const maxCadAnno = conCadenzaAnno.length ? conCadenzaAnno.reduce((a,b) => a.cadenza > b.cadenza ? a : b) : null;
        const fmt = (dateStr) => new Date(dateStr).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'});
        const righeAttivita = datiAnnoOrd.map((a,i) => {
            const cad = (a.cadenza && a.cadenza > 0) ? Math.round(a.cadenza) + ' rpm' : '—';
            const dis = (a.dislivello && a.dislivello > 0) ? Math.round(a.dislivello) + ' m' : '—';
            return `<tr><td>${i+1}</td><td>${fmt(a.data)}</td><td>${a.nome||'—'}</td><td><b>${parseFloat(a.distanza).toFixed(1)} km</b></td><td>${formattaTempo(parseFloat(a.tempo))}</td><td>${parseFloat(a.media).toFixed(2)} km/h</td><td>${dis}</td><td>${cad}</td></tr>`;
        }).join('');
        const cadRecordHtml = maxCadAnno ? `<h2>Record Cadenza ${anno}</h2><p style="font-size:.85em;">&#129354; Cadenza più alta: <b>${Math.round(maxCadAnno.cadenza)} rpm</b> — ${fmt(maxCadAnno.data)}${maxCadAnno.nome?' ('+maxCadAnno.nome+')':''}</p>` : '';
        const contenuto = `<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><style>body{font-family:Arial,sans-serif;max-width:900px;margin:0 auto;padding:20px;color:#111}h1{color:#fb8c00;border-bottom:3px solid #fb8c00;padding-bottom:10px}h2{color:#fb8c00;margin-top:30px;font-size:1em;text-transform:uppercase;letter-spacing:1px}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:20px 0}.stat-box{background:#fff8f0;border:1px solid #fb8c00;border-radius:10px;padding:15px;text-align:center}.stat-box .val{font-size:1.8em;font-weight:900;color:#fb8c00}.stat-box .lab{font-size:.75em;color:#888;text-transform:uppercase}table{width:100%;border-collapse:collapse;margin:10px 0}th{background:#fb8c00;color:white;padding:8px;text-align:left;font-size:.85em}td{padding:7px 8px;border-bottom:1px solid #eee;font-size:.85em}tr:nth-child(even){background:#fff8f0}.footer{margin-top:40px;text-align:center;color:#aaa;font-size:.75em;border-top:1px solid #eee;padding-top:15px}</style></head><body><h1>&#128690; Bainzuretta — Riepilogo ${anno}</h1><div class="stats-grid"><div class="stat-box"><div class="val">${totKm.toLocaleString('it-IT',{minimumFractionDigits:1,maximumFractionDigits:1})}</div><div class="lab">km totali</div></div><div class="stat-box"><div class="val">${nUscite}</div><div class="lab">uscite</div></div><div class="stat-box"><div class="val">${medPond.toFixed(2)}</div><div class="lab">km/h media pond.</div></div><div class="stat-box"><div class="val">${(totKm/nUscite).toFixed(1)}</div><div class="lab">km medi/uscita</div></div><div class="stat-box"><div class="val">${Math.floor(totOre)}h ${Math.round((totOre%1)*60)}m</div><div class="lab">ore in sella</div></div><div class="stat-box"><div class="val">${(totKm/40075).toFixed(3)}</div><div class="lab">giri del mondo</div></div></div><h2>Top 5 Uscite per Distanza</h2><table><tr><th>#</th><th>Data</th><th>Nome</th><th>Distanza</th><th>Media</th></tr>${top5Dist.map((a,i)=>`<tr><td>${i+1}</td><td>${fmt(a.data)}</td><td>${a.nome||'—'}</td><td><b>${parseFloat(a.distanza).toFixed(1)} km</b></td><td>${parseFloat(a.media).toFixed(2)} km/h</td></tr>`).join('')}</table><h2>Top 5 Uscite per Velocita</h2><table><tr><th>#</th><th>Data</th><th>Nome</th><th>Media</th><th>Distanza</th></tr>${top5Media.map((a,i)=>`<tr><td>${i+1}</td><td>${fmt(a.data)}</td><td>${a.nome||'—'}</td><td><b>${parseFloat(a.media).toFixed(2)} km/h</b></td><td>${parseFloat(a.distanza).toFixed(1)} km</td></tr>`).join('')}</table><h2>Statistiche Mensili</h2><table><tr><th>Mese</th><th>Km Totali</th><th>Uscite</th><th>Media km/uscita</th></tr>${mesiNomi.map((nome,i)=>pMesi[i]?`<tr><td>${nome}</td><td><b>${pMesi[i].km.toFixed(1)}</b></td><td>${pMesi[i].count}</td><td>${(pMesi[i].km/pMesi[i].count).toFixed(1)}</td></tr>`:'').join('')}</table>${cadRecordHtml}<h2>Tutte le Attivita ${anno}</h2><table><tr><th>#</th><th>Data</th><th>Nome</th><th>Distanza</th><th>Tempo</th><th>Media</th><th>Dislivello</th><th>Cadenza</th></tr>${righeAttivita}</table><div class="footer">Generato da Bainzuretta il ${new Date().toLocaleDateString('it-IT')} — allerock.github.io/bainzuretta</div></body></html>`;
        const a = document.createElement('a');
        a.href = 'data:text/html;charset=utf-8,' + encodeURIComponent(contenuto);
        a.download = `Bainzuretta_${anno}.html`;
        a.click();
        showToast('Apri il file scaricato e stampa come PDF!', 4000);
    }

    function mostraInfoObiettivo() {
        alert('LEGENDA COLORI\n\n🟢 Verde — sei in anticipo rispetto al passo necessario per raggiungere l\'obiettivo\n\n🟡 Giallo — sei indietro fino al 10% rispetto al passo necessario\n\n🔴 Rosso — sei indietro di oltre il 10% rispetto al passo necessario\n\nCALCOLI\n\nProiezione: (km fatti / giorno dell\'anno) × giorni totali anno\n\nKm/sett: km mancanti all\'obiettivo ÷ settimane rimanenti\n\nArrivo previsto: calcolato sulla media km/settimana attuale');
    }

    function apriAttivita(id) {
        const a = rawData.find(x => x.id == id);
        if (!a) return;
        const data = new Date(a.data).toLocaleDateString('it-IT', {day:'2-digit', month:'2-digit', year:'numeric'});
        const nome = a.nome ? '\n"' + a.nome + '"' : '';
        const dis = a.dislivello ? '\nDislivello: ' + a.dislivello.toFixed(0) + ' m' : '';
        const cad = (a.cadenza && a.cadenza > 0) ? '\nCadenza: ' + Math.round(a.cadenza) + ' rpm' : '';
        const msg = data + nome + '\n\n' + parseFloat(a.distanza).toFixed(1) + ' km\n' + formattaTempo(parseFloat(a.tempo)) + '\n' + parseFloat(a.media).toFixed(2) + ' km/h' + dis + cad;
        if (a.strava_id) {
            if (confirm(msg + '\n\nVuoi aprire su Strava?')) {
                const webUrl = 'https://www.strava.com/activities/' + a.strava_id;
                const appUrl = 'strava://activities/' + a.strava_id;
                let tornato = false;
                document.addEventListener('visibilitychange', function onHide() {
                    if (document.hidden) { tornato = true; }
                    document.removeEventListener('visibilitychange', onHide);
                }, { once: true });
                window.location.href = appUrl;
                setTimeout(function () {
                    if (!tornato) { window.open(webUrl, '_blank'); }
                }, 800);
            }
        } else { alert(msg); }
    }

    function esportaJSON() {
        const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(rawData));
        const a = document.createElement('a'); a.href = dataStr; a.download = 'bainzuretta.json'; a.click();
    }

    document.getElementById('json-input').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            rawData = JSON.parse(new TextDecoder().decode(ev.target.result));
            localStorage.setItem('bainzuretta_raw', JSON.stringify(rawData));
            aggiornaStats(); popolaAnniArchivio(); showToast('Dati importati!');
        };
        reader.readAsArrayBuffer(e.target.files[0]);
    };

    function vaiA(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        document.querySelectorAll('nav div').forEach(n => n.classList.remove('active'));
        document.getElementById('nav-'+id).classList.add('active');
        if(id === 'ranking') disegnaClassifica();
        if(id === 'sfida') disegnaSfida();
        if(id === 'diario') disegnaDiario();
        if(id === 'archivio') disegnaArchivio();
        if(id === 'records') disegnaRecords();
    }

    function apriArchivioAnno(anno) { const sel = document.getElementById('sel-anno-archivio'); sel.value = anno; vaiA('archivio'); }

    function eliminaAttivita(id) {
        if(confirm('Elimina?')) {
            rawData = rawData.filter(a => a.id !== id);
            localStorage.setItem('bainzuretta_raw', JSON.stringify(rawData));
            disegnaDiario(); aggiornaStats();
        }
    }

    function pulisciTutto() { if(confirm('CANCELLARE TUTTO?')) { localStorage.clear(); location.reload(); } }

    function cambiaObiettivo() {
        let n = prompt('Target per il ' + currY + ':', myTarget);
        if(n) { myTarget = parseInt(n); localStorage.setItem('bainzuretta_target_' + currY, n); document.getElementById('val-target-tot').innerText = myTarget; aggiornaStats(); }
    }

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => { regs.forEach(reg => reg.unregister()); });
    }
</script>
